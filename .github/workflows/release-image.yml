name: release image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: callsmith-release-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the verified image once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/callsmith:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://web-production-6cecc.up.railway.app
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment identity
        run: |
          mkdir -p outputs/release
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/callsmith:${GITHUB_SHA}"
            echo "digest=${{ steps.build.outputs.digest }}"
          } > outputs/release/image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: callsmith-release-image
          path: outputs/release/image.txt

